<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pong — Online Multiplayer & Computer</title>
    <meta name="description" content="Classic Pong game with online multiplayer and computer opponent. Play with friends or solo!">
    <meta name="theme-color" content="#a800ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #a800ff;
            --primary-deep: #8a00cc;
            --primary-soft: #e6ccff;
            --primary-glow: rgba(168, 0, 255, 0.15);
            --primary-glow-strong: rgba(168, 0, 255, 0.25);
            --ink: #1a1a2e;
            --ink-soft: #16213e;
            --paper: #f8f9fa;
            --card: #ffffff;
            --muted: #5a5a7a;
            --muted-light: #8f8fa8;
            --line: rgba(26, 26, 46, 0.12);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.3);
            --warning: #f59e0b;
            --danger: #ef4444;
            --display: "Space Grotesk", system-ui, sans-serif;
            --mono: "IBM Plex Mono", ui-monospace, monospace;
            --shadow-sm: 0 2px 8px rgba(168, 0, 255, 0.08);
            --shadow-md: 0 8px 24px rgba(168, 0, 255, 0.15);
            --shadow-lg: 0 16px 48px rgba(168, 0, 255, 0.2);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --focus-ring: 3px solid var(--primary);
            --touch-target: 44px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--display);
            background: linear-gradient(135deg, #f8f9fa 0%, #e6ccff 50%, #f8f9fa 100%);
            color: var(--ink);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            touch-action: manipulation;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .container {
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow-lg);
            max-width: 500px;
            width: 100%;
            height: 100vh;
            max-height: 900px;
            position: relative;
            z-index: 1;
            border: 2px solid var(--primary);
            display: flex;
            flex-direction: column;
            animation: slideIn 0.5s ease-out;
        }

        @media (min-width: 768px) {
            .container {
                height: auto;
                max-height: 90vh;
                border-radius: 24px;
                padding: 30px;
            }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            flex-shrink: 0;
            gap: 10px;
        }

        .game-title {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-deep) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .mode-selector {
            display: flex;
            gap: 6px;
            background: var(--paper);
            padding: 4px;
            border-radius: 8px;
        }

        .mode-btn {
            padding: 8px 12px;
            border: none;
            background: transparent;
            color: var(--muted);
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--display);
            font-weight: 600;
            font-size: 13px;
            transition: all var(--transition);
            min-height: 36px;
            white-space: nowrap;
        }

        .mode-btn:hover {
            color: var(--primary);
        }

        .mode-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 8px var(--primary-glow-strong);
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--ink);
            border-radius: 12px;
            padding: 12px;
            flex-shrink: 0;
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }

        .scoreboard::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--primary-glow), transparent 50%);
            pointer-events: none;
        }

        .score {
            text-align: center;
            position: relative;
            z-index: 1;
            flex: 1;
        }

        .score h3 {
            color: white;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 4px;
        }

        .score p {
            color: var(--primary);
            font-family: var(--mono);
            font-size: 32px;
            font-weight: 700;
            line-height: 1;
            transition: all 0.3s ease;
        }

        .score p.winner {
            color: var(--success);
            text-shadow: 0 0 20px var(--success-glow);
            animation: pulseScore 0.5s ease;
        }

        @keyframes pulseScore {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .game-info {
            text-align: center;
            padding: 8px 0;
            font-family: var(--mono);
            font-size: 13px;
            color: var(--muted);
            min-height: 30px;
            flex-shrink: 0;
        }

        #gameStatus.winner {
            color: var(--success);
            font-weight: 700;
            font-size: 16px;
            animation: pulseText 1s ease infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .game-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            max-height: 400px;
            border-radius: 12px;
            background: var(--ink);
            box-shadow: var(--shadow-md);
            border: 2px solid var(--primary);
            transition: all var(--transition);
            touch-action: none;
        }

        canvas.game-active {
            border-color: var(--success);
            box-shadow: var(--shadow-lg), 0 0 40px var(--success-glow);
        }

        .multiplayer-setup {
            background: var(--paper);
            border-radius: 12px;
            padding: 15px;
            flex-shrink: 0;
            border: 2px solid var(--line);
            margin-top: 10px;
        }

        .setup-header {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .room-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .room-input {
            flex: 1;
            min-width: 120px;
            padding: 12px;
            border: 2px solid var(--line);
            border-radius: 8px;
            font-family: var(--display);
            font-size: 16px;
            transition: all var(--transition);
            background: white;
        }

        .room-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .btn {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-family: var(--display);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition);
            min-height: var(--touch-target);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px var(--primary-glow-strong);
        }

        .btn-primary:hover {
            background: var(--primary-deep);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--ink);
            color: white;
        }

        .btn-secondary:hover {
            background: var(--ink-soft);
            transform: translateY(-2px);
        }

        .btn-success {
            background: var(--success);
            color: white;
            box-shadow: 0 4px 12px var(--success-glow);
        }

        .btn-success:hover {
            background: #0d9668;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .room-info {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            padding: 10px;
            background: var(--card);
            border-radius: 8px;
            border: 1px solid var(--line);
            margin-top: 10px;
        }

        .room-code-display {
            font-family: var(--mono);
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.1em;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--muted-light);
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: var(--success);
            animation: none;
        }

        .status-dot.connecting {
            background: var(--warning);
        }

        .status-dot.disconnected {
            background: var(--danger);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .copy-btn {
            background: var(--primary-glow);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-family: var(--display);
            font-weight: 600;
            transition: all var(--transition);
        }

        .copy-btn:hover {
            background: var(--primary);
            color: white;
        }

        /* Celebration overlay */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .winner-banner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: var(--card);
            border: 3px solid var(--success);
            border-radius: 20px;
            padding: 25px 35px;
            box-shadow: var(--shadow-lg);
            z-index: 1001;
            text-align: center;
            animation: bannerPop 0.5s ease forwards;
            pointer-events: auto;
            max-width: 90vw;
        }

        @keyframes bannerPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            70% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .winner-banner h2 {
            color: var(--success);
            font-size: 28px;
            margin-bottom: 8px;
        }

        .winner-banner p {
            font-size: 16px;
            color: var(--ink);
            margin-bottom: 15px;
        }

        .winner-banner button {
            padding: 12px 24px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: var(--display);
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all var(--transition);
            min-height: var(--touch-target);
        }

        .winner-banner button:hover {
            background: #0d9668;
            transform: translateY(-2px);
        }

        @media (min-width: 768px) {
            .game-title { font-size: 28px; }
            .score p { font-size: 40px; }
            .score h3 { font-size: 14px; }
            .setup-header { font-size: 18px; }
            .winner-banner { padding: 30px 50px; }
            .winner-banner h2 { font-size: 36px; }
            .winner-banner p { font-size: 18px; }
            .mode-btn { font-size: 14px; padding: 8px 16px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        .prevent-scroll {
            overscroll-behavior: none;
            touch-action: none;
        }
    </style>
</head>
<body class="prevent-scroll">
    <div class="container">
        <div class="game-header">
            <h1 class="game-title">PONG</h1>
            <div class="mode-selector" role="tablist" aria-label="Game mode selector">
                <button class="mode-btn active" data-mode="computer" role="tab" aria-selected="true">🤖 Computer</button>
                <button class="mode-btn" data-mode="online" role="tab" aria-selected="false">🌐 Online</button>
            </div>
        </div>

        <div class="scoreboard">
            <div class="score">
                <h3 id="player1Label">You</h3>
                <p id="player1Score">0</p>
            </div>
            <div class="score">
                <h3 id="player2Label">Computer</h3>
                <p id="player2Score">0</p>
            </div>
        </div>

        <div class="game-info">
            <p id="gameStatus">Tap to start playing</p>
        </div>

        <div class="game-area">
            <canvas id="gameCanvas" width="800" height="400" aria-label="Pong game canvas"></canvas>
        </div>

        <div class="multiplayer-setup" id="onlineSetup" style="display: none;">
            <h3 class="setup-header">Online Multiplayer</h3>
            <div class="room-controls">
                <input type="text" id="roomInput" class="room-input" placeholder="Room code..." maxlength="6" autocapitalize="characters" autocomplete="off">
                <button class="btn btn-primary" id="createRoomBtn">Create</button>
                <button class="btn btn-secondary" id="joinRoomBtn">Join</button>
            </div>
            <div class="room-info" id="roomInfo" style="display: none;">
                <span>Room:</span>
                <span class="room-code-display" id="roomCodeDisplay"></span>
                <button class="copy-btn" id="copyRoomBtn">Copy</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.1/peerjs.min.js"></script>
    <script>
        (function() {
            'use strict';

            // Game configuration
            const CONFIG = {
                WINNING_SCORE: 20,
                CANVAS_WIDTH: 800,
                CANVAS_HEIGHT: 400,
                PADDLE_WIDTH: 12,
                PADDLE_HEIGHT: 80,
                BALL_SIZE: 10,
                BALL_SPEED_INITIAL: 5,
                BALL_SPEED_INCREMENT: 0.5,
                COMPUTER_SPEED: 4,
                COLORS: {
                    background: '#1a1a2e',
                    paddle1: '#a800ff',
                    paddle2: '#10b981',
                    ball: '#ffffff',
                    centerLine: 'rgba(168, 0, 255, 0.3)',
                }
            };

            // Game state
            const state = {
                mode: 'computer',
                player1Score: 0,
                player2Score: 0,
                ballX: CONFIG.CANVAS_WIDTH / 2,
                ballY: CONFIG.CANVAS_HEIGHT / 2,
                ballSpeedX: CONFIG.BALL_SPEED_INITIAL,
                ballSpeedY: CONFIG.BALL_SPEED_INITIAL,
                paddle1Y: CONFIG.CANVAS_HEIGHT / 2 - CONFIG.PADDLE_HEIGHT / 2,
                paddle2Y: CONFIG.CANVAS_HEIGHT / 2 - CONFIG.PADDLE_HEIGHT / 2,
                gameRunning: false,
                gameOver: false,
                isHost: false,
                peer: null,
                connection: null,
                roomCode: null,
                touchY: null,
            };

            // DOM elements
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const player1ScoreEl = document.getElementById('player1Score');
            const player2ScoreEl = document.getElementById('player2Score');
            const player1LabelEl = document.getElementById('player1Label');
            const player2LabelEl = document.getElementById('player2Label');
            const gameStatusEl = document.getElementById('gameStatus');
            const roomInput = document.getElementById('roomInput');
            const createRoomBtn = document.getElementById('createRoomBtn');
            const joinRoomBtn = document.getElementById('joinRoomBtn');
            const roomInfo = document.getElementById('roomInfo');
            const roomCodeDisplay = document.getElementById('roomCodeDisplay');
            const copyRoomBtn = document.getElementById('copyRoomBtn');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const onlineSetup = document.getElementById('onlineSetup');
            const modeButtons = document.querySelectorAll('.mode-btn');

            // Initialize
            function init() {
                setupEventListeners();
                resetGame();
                requestAnimationFrame(gameLoop);
            }

            // Setup event listeners
            function setupEventListeners() {
                // Mode selection
                modeButtons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        switchMode(btn.dataset.mode);
                    });
                });

                // Room controls
                createRoomBtn.addEventListener('click', createRoom);
                joinRoomBtn.addEventListener('click', joinRoom);
                copyRoomBtn.addEventListener('click', copyRoomCode);

                roomInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        joinRoom();
                    }
                });

                // Touch controls
                canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
                canvas.addEventListener('touchmove', handleTouchMove, { passive: false });

                // Mouse controls
                canvas.addEventListener('mousemove', handleMouseMove);

                // Click to start
                canvas.addEventListener('click', () => {
                    if (!state.gameRunning && !state.gameOver) {
                        startGame();
                    }
                });

                // Prevent scrolling on touch
                document.addEventListener('touchmove', (e) => {
                    if (e.target === canvas) {
                        e.preventDefault();
                    }
                }, { passive: false });
            }

            // Switch game mode
            function switchMode(mode) {
                state.mode = mode;
                
                modeButtons.forEach(btn => {
                    btn.classList.remove('active');
                    btn.setAttribute('aria-selected', 'false');
                    if (btn.dataset.mode === mode) {
                        btn.classList.add('active');
                        btn.setAttribute('aria-selected', 'true');
                    }
                });

                // Show/hide online setup
                if (mode === 'online') {
                    onlineSetup.style.display = 'block';
                    player2LabelEl.textContent = 'Opponent';
                    if (!state.peer) {
                        initPeer();
                    }
                } else {
                    onlineSetup.style.display = 'none';
                    player2LabelEl.textContent = 'Computer';
                    // Close any existing connection
                    if (state.connection) {
                        state.connection.close();
                        state.connection = null;
                    }
                }

                resetGame();
            }

            // Initialize PeerJS
            function initPeer() {
                state.peer = new Peer();
                
                state.peer.on('open', (id) => {
                    console.log('My peer ID is: ' + id);
                });
                
                state.peer.on('connection', (conn) => {
                    if (state.isHost && !state.connection) {
                        state.connection = conn;
                        setupConnection();
                        startGame();
                    }
                });
                
                state.peer.on('error', (err) => {
                    console.error('PeerJS error:', err);
                    if (err.type === 'peer-unavailable') {
                        gameStatusEl.textContent = 'Room not found. Check the code.';
                    }
                });
            }

            // Create room
            function createRoom() {
                if (!state.peer) {
                    initPeer();
                }
                
                state.isHost = true;
                state.roomCode = generateRoomCode();
                roomCodeDisplay.textContent = state.roomCode;
                roomInfo.style.display = 'flex';
                gameStatusEl.textContent = 'Share this code with your friend';
            }

            // Join room
            function joinRoom() {
                const code = roomInput.value.trim().toUpperCase();
                if (!code) {
                    gameStatusEl.textContent = 'Please enter a room code';
                    return;
                }
                
                state.isHost = false;
                state.roomCode = code;
                roomCodeDisplay.textContent = code;
                roomInfo.style.display = 'flex';
                gameStatusEl.textContent = 'Connecting...';
                
                // Connect to host
                if (state.peer) {
                    const conn = state.peer.connect(code);
                    state.connection = conn;
                    setupConnection();
                }
            }

            // Generate room code
            function generateRoomCode() {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let code = '';
                for (let i = 0; i < 6; i++) {
                    code += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return code;
            }

            // Copy room code
            function copyRoomCode() {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(state.roomCode).then(() => {
                        copyRoomBtn.textContent = 'Copied!';
                        setTimeout(() => {
                            copyRoomBtn.textContent = 'Copy';
                        }, 2000);
                    });
                }
            }

            // Setup connection
            function setupConnection() {
                if (!state.connection) return;
                
                state.connection.on('data', (data) => {
                    handleNetworkData(data);
                });
                
                state.connection.on('open', () => {
                    gameStatusEl.textContent = 'Connected! Ready to play';
                    if (state.isHost) {
                        startGame();
                    }
                });
                
                state.connection.on('close', () => {
                    state.gameRunning = false;
                    gameStatusEl.textContent = 'Connection lost';
                });
            }

            // Handle network data
            function handleNetworkData(data) {
                switch(data.type) {
                    case 'paddle':
                        state.paddle2Y = data.position;
                        break;
                    case 'ball':
                        state.ballX = data.x;
                        state.ballY = data.y;
                        state.ballSpeedX = data.speedX;
                        state.ballSpeedY = data.speedY;
                        break;
                    case 'score':
                        state.player2Score = data.score;
                        player2ScoreEl.textContent = state.player2Score;
                        if (state.player2Score >= CONFIG.WINNING_SCORE) {
                            endGame('player2');
                        }
                        break;
                    case 'start':
                        startGame();
                        break;
                    case 'reset':
                        resetGame();
                        break;
                }
            }

            // Send data to peer
            function sendToPeer(data) {
                if (state.connection && state.connection.open) {
                    state.connection.send(data);
                }
            }

            // Touch handlers
            function handleTouchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                const scaleY = CONFIG.CANVAS_HEIGHT / rect.height;
                state.touchY = (touch.clientY - rect.top) * scaleY;
                updatePaddlePosition(state.touchY);
            }

            function handleTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                const scaleY = CONFIG.CANVAS_HEIGHT / rect.height;
                state.touchY = (touch.clientY - rect.top) * scaleY;
                updatePaddlePosition(state.touchY);
            }

            // Mouse handler
            function handleMouseMove(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleY = CONFIG.CANVAS_HEIGHT / rect.height;
                const mouseY = (e.clientY - rect.top) * scaleY;
                updatePaddlePosition(mouseY);
            }

            // Update paddle position
            function updatePaddlePosition(y) {
                state.paddle1Y = y - CONFIG.PADDLE_HEIGHT / 2;
                state.paddle1Y = Math.max(0, Math.min(CONFIG.CANVAS_HEIGHT - CONFIG.PADDLE_HEIGHT, state.paddle1Y));
                
                // Send paddle position in online mode
                if (state.mode === 'online' && state.connection && state.connection.open) {
                    sendToPeer({ type: 'paddle', position: state.paddle1Y });
                }
            }

            // Reset ball
            function resetBall() {
                state.ballX = CONFIG.CANVAS_WIDTH / 2;
                state.ballY = CONFIG.CANVAS_HEIGHT / 2;
                state.ballSpeedX = (Math.random() > 0.5 ? 1 : -1) * CONFIG.BALL_SPEED_INITIAL;
                state.ballSpeedY = (Math.random() > 0.5 ? 1 : -1) * CONFIG.BALL_SPEED_INITIAL;
            }

            // Reset game
            function resetGame() {
                state.player1Score = 0;
                state.player2Score = 0;
                state.gameRunning = false;
                state.gameOver = false;
                state.paddle1Y = CONFIG.CANVAS_HEIGHT / 2 - CONFIG.PADDLE_HEIGHT / 2;
                state.paddle2Y = CONFIG.CANVAS_HEIGHT / 2 - CONFIG.PADDLE_HEIGHT / 2;
                
                player1ScoreEl.textContent = '0';
                player2ScoreEl.textContent = '0';
                player1ScoreEl.classList.remove('winner');
                player2ScoreEl.classList.remove('winner');
                gameStatusEl.classList.remove('winner');
                canvas.classList.remove('game-active');
                
                if (state.mode === 'computer') {
                    gameStatusEl.textContent = 'Tap to start playing';
                } else {
                    gameStatusEl.textContent = 'Create or join a room to play';
                }
                
                resetBall();
            }

            // Start game
            function startGame() {
                state.gameRunning = true;
                state.gameOver = false;
                canvas.classList.add('game-active');
                gameStatusEl.textContent = 'Game in progress...';
                
                if (state.mode === 'online' && state.isHost) {
                    sendToPeer({ type: 'start' });
                }
            }

            // End game
            function endGame(winner) {
                state.gameRunning = false;
                state.gameOver = true;
                
                canvas.classList.remove('game-active');
                
                if (winner === 'player1') {
                    player1ScoreEl.classList.add('winner');
                    gameStatusEl.textContent = 'You Win! 🎉';
                } else {
                    player2ScoreEl.classList.add('winner');
                    gameStatusEl.textContent = state.mode === 'computer' ? 'Computer Wins! 🎉' : 'Opponent Wins! 🎉';
                }
                
                gameStatusEl.classList.add('winner');
                createCelebration(winner);
            }

            // Create celebration animation
            function createCelebration(winner) {
                const celebrationDiv = document.createElement('div');
                celebrationDiv.className = 'celebration';
                document.body.appendChild(celebrationDiv);
                
                const colors = ['#a800ff', '#10b981', '#f59e0b', '#ef4444', '#3b82f6', '#ec4899'];
                
                for (let i = 0; i < 80; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = -10 + 'px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = (Math.random() * 8 + 4) + 'px';
                    confetti.style.height = (Math.random() * 8 + 4) + 'px';
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    confetti.style.animationDelay = (Math.random() * 1.5) + 's';
                    celebrationDiv.appendChild(confetti);
                }
                
                const banner = document.createElement('div');
                banner.className = 'winner-banner';
                banner.setAttribute('role', 'alert');
                banner.innerHTML = `
                    <h2>🎉 Winner! 🎉</h2>
                    <p>${winner === 'player1' ? 'You win the game!' : state.mode === 'computer' ? 'Computer wins!' : 'Your opponent wins!'}</p>
                    <button id="playAgainBtn">Play Again</button>
                `;
                document.body.appendChild(banner);
                
                document.getElementById('playAgainBtn').addEventListener('click', () => {
                    banner.remove();
                    celebrationDiv.remove();
                    resetGame();
                    if (state.mode === 'online' && state.isHost) {
                        sendToPeer({ type: 'reset' });
                    }
                });
                
                setTimeout(() => {
                    if (celebrationDiv.parentNode) {
                        celebrationDiv.remove();
                    }
                }, 5000);
            }

            // Update game logic
            function update() {
                if (!state.gameRunning || state.gameOver) return;
                
                // Move computer paddle
                if (state.mode === 'computer') {
                    const paddle2Center = state.paddle2Y + CONFIG.PADDLE_HEIGHT / 2;
                    if (paddle2Center < state.ballY) {
                        state.paddle2Y = Math.min(CONFIG.CANVAS_HEIGHT - CONFIG.PADDLE_HEIGHT, state.paddle2Y + CONFIG.COMPUTER_SPEED);
                    } else if (paddle2Center > state.ballY) {
                        state.paddle2Y = Math.max(0, state.paddle2Y - CONFIG.COMPUTER_SPEED);
                    }
                }
                
                // Only host updates ball physics in online mode
                if (state.mode === 'computer' || state.isHost) {
                    // Move ball
                    state.ballX += state.ballSpeedX;
                    state.ballY += state.ballSpeedY;
                    
                    // Ball collision with top and bottom
                    if (state.ballY <= 0 || state.ballY >= CONFIG.CANVAS_HEIGHT - CONFIG.BALL_SIZE) {
                        state.ballSpeedY = -state.ballSpeedY;
                    }
                    
                    // Ball collision with paddles
                    if (
                        state.ballX <= CONFIG.PADDLE_WIDTH &&
                        state.ballX >= 0 &&
                        state.ballY + CONFIG.BALL_SIZE >= state.paddle1Y &&
                        state.ballY <= state.paddle1Y + CONFIG.PADDLE_HEIGHT
                    ) {
                        state.ballSpeedX = Math.abs(state.ballSpeedX) + CONFIG.BALL_SPEED_INCREMENT;
                        state.ballX = CONFIG.PADDLE_WIDTH;
                    }
                    
                    if (
                        state.ballX >= CONFIG.CANVAS_WIDTH - CONFIG.PADDLE_WIDTH - CONFIG.BALL_SIZE &&
                        state.ballX <= CONFIG.CANVAS_WIDTH - CONFIG.PADDLE_WIDTH &&
                        state.ballY + CONFIG.BALL_SIZE >= state.paddle2Y &&
                        state.ballY <= state.paddle2Y + CONFIG.PADDLE_HEIGHT
                    ) {
                        state.ballSpeedX = -(Math.abs(state.ballSpeedX) + CONFIG.BALL_SPEED_INCREMENT);
                        state.ballX = CONFIG.CANVAS_WIDTH - CONFIG.PADDLE_WIDTH - CONFIG.BALL_SIZE;
                    }
                    
                    // Score points
                    if (state.ballX < 0) {
                        state.player2Score++;
                        player2ScoreEl.textContent = state.player2Score;
                        resetBall();
                        
                        if (state.mode === 'online') {
                            sendToPeer({ type: 'score', score: state.player2Score });
                        }
                        
                        if (state.player2Score >= CONFIG.WINNING_SCORE) {
                            endGame('player2');
                        }
                    }
                    
                    if (state.ballX > CONFIG.CANVAS_WIDTH) {
                        state.player1Score++;
                        player1ScoreEl.textContent = state.player1Score;
                        resetBall();
                        
                        if (state.mode === 'online') {
                            sendToPeer({ type: 'score', score: state.player1Score });
                        }
                        
                        if (state.player1Score >= CONFIG.WINNING_SCORE) {
                            endGame('player1');
                        }
                    }
                    
                    // Send ball position in online mode
                    if (state.mode === 'online') {
                        sendToPeer({
                            type: 'ball',
                            x: state.ballX,
                            y: state.ballY,
                            speedX: state.ballSpeedX,
                            speedY: state.ballSpeedY
                        });
                    }
                }
            }

            // Render game
            function render() {
                // Clear canvas
                ctx.fillStyle = CONFIG.COLORS.background;
                ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
                
                // Draw center line
                ctx.strokeStyle = CONFIG.COLORS.centerLine;
                ctx.lineWidth = 2;
                ctx.setLineDash([10, 10]);
                ctx.beginPath();
                ctx.moveTo(CONFIG.CANVAS_WIDTH / 2, 0);
                ctx.lineTo(CONFIG.CANVAS_WIDTH / 2, CONFIG.CANVAS_HEIGHT);
                ctx.stroke();
                ctx.setLineDash([]);
                
                // Draw paddles
                ctx.fillStyle = CONFIG.COLORS.paddle1;
                ctx.fillRect(0, state.paddle1Y, CONFIG.PADDLE_WIDTH, CONFIG.PADDLE_HEIGHT);
                
                ctx.fillStyle = CONFIG.COLORS.paddle2;
                ctx.fillRect(
                    CONFIG.CANVAS_WIDTH - CONFIG.PADDLE_WIDTH,
                    state.paddle2Y,
                    CONFIG.PADDLE_WIDTH,
                    CONFIG.PADDLE_HEIGHT
                );
                
                // Draw ball
                ctx.fillStyle = CONFIG.COLORS.ball;
                ctx.fillRect(state.ballX, state.ballY, CONFIG.BALL_SIZE, CONFIG.BALL_SIZE);
                
                // Draw overlay text
                if (!state.gameRunning && !state.gameOver) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                    ctx.font = '18px "Space Grotesk", sans-serif';
                    ctx.textAlign = 'center';
                    
                    if (state.mode === 'computer') {
                        ctx.fillText('Tap to start playing', CONFIG.CANVAS_WIDTH / 2, CONFIG.CANVAS_HEIGHT / 2);
                        ctx.fillText(`First to ${CONFIG.WINNING_SCORE} wins!`, CONFIG.CANVAS_WIDTH / 2, CONFIG.CANVAS_HEIGHT / 2 + 25);
                    } else {
                        if (state.connection && state.connection.open) {
                            ctx.fillText('Connected! Ready to play', CONFIG.CANVAS_WIDTH / 2, CONFIG.CANVAS_HEIGHT / 2);
                            ctx.fillText(`First to ${CONFIG.WINNING_SCORE} wins!`, CONFIG.CANVAS_WIDTH / 2, CONFIG.CANVAS_HEIGHT / 2 + 25);
                        } else {
                            ctx.fillText('Create or join a room', CONFIG.CANVAS_WIDTH / 2, CONFIG.CANVAS_HEIGHT / 2);
                            ctx.fillText('to start playing', CONFIG.CANVAS_WIDTH / 2, CONFIG.CANVAS_HEIGHT / 2 + 25);
                        }
                    }
                }
            }

            // Game loop
            function gameLoop() {
                update();
                render();
                requestAnimationFrame(gameLoop);
            }

            // Start
            init();
        })();
    </script>
</body>
</html>
